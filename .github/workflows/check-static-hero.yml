# The static hero in index.html exists for crawlers and first paint, and app.js
# overwrites it at runtime — so nothing on the live site looks wrong when the
# two fall out of step. Only search results do, months later. Hence a CI gate.
name: Static hero

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/check-static-hero.mjs
