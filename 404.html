<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — In Great Company</title>
  <!-- Cloudflare Pages serves this file with a real 404 status for any path it
       cannot match. Without it, Pages falls back to index.html at 200, which
       turns every typo and dead link into a duplicate of the homepage — soft
       404s in Search Console, and crawl budget spent on pages that aren't. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/assets/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/page.css">
</head>
<body>
  <main class="page-card">
    <img class="page-logo" src="/assets/img/logo-cream-340.png" width="340" height="178" alt="In Great Company">
    <h1 class="page-title">This page isn't here</h1>
    <p class="page-lead">The link might be old, or we may have moved things around. Either way, the gatherings are still on.</p>
    <a class="page-btn" href="/#gatherings">See what's coming up</a>
    <p class="page-fine">Or head back to the <a href="/">homepage</a>.</p>
  </main>
</body>
</html>
