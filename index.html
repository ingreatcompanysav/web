<head>
  <meta charset="utf-8">

  <title>In Great Company — a women's social group in Savannah, GA</title>
  <meta name="description" content="A women's social group in Savannah, Georgia. New to town, starting a new chapter, or craving real friendship — there's a seat here for you.">
  <link rel="canonical" href="https://ingreatcompanysav.com/">

  <!-- Open Graph (link previews: iMessage, Facebook, WhatsApp, LinkedIn) -->

  <!-- The wordmark on the brand teal, not a photo. photo-hero.jpg is portrait
       (1000x1249): a 1.91:1 card centre-crops it, dropping 58% of the height
       and cutting faces. og-card.jpg is built at the card's own ratio.
       The site is hash-routed, so scrapers never see #gatherings / #event/x —
       this one card is the preview for every shareable URL on the site. -->
  <meta property="og:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="In Great Company">

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="In Great Company — a women's social group in Savannah, GA">

  <meta name="twitter:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
