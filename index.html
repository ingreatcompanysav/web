<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In Great Company — a women's social group in Savannah, GA</title>
  <meta name="description" content="A women's social group in Savannah, Georgia. New to town, starting a new chapter, or craving real friendship — there's a seat here for you.">
  <link rel="canonical" href="https://ingreatcompanysav.com/">

  <!-- Favicon -->
  <link rel="icon" href="/assets/img/logo-cream.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/logo-cream.png">

  <!-- Open Graph (link previews: iMessage, Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="In Great Company">
  <meta property="og:title" content="In Great Company — a women's social group in Savannah, GA">
  <meta property="og:description" content="New to town, starting a new chapter, or craving real friendship — there's a seat here for you.">
  <meta property="og:url" content="https://ingreatcompanysav.com/">
  <!-- The wordmark on the brand teal, not a photo. photo-hero.jpg is portrait
       (1000x1249): a 1.91:1 card centre-crops it, dropping 58% of the height
       and cutting faces. og-card.jpg is built at the card's own ratio.
       The site is hash-routed, so scrapers never see #gatherings / #event/x —
       this one card is the preview for every shareable URL on the site. -->
  <meta property="og:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="In Great Company">

  <!-- Twitter/X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="In Great Company — a women's social group in Savannah, GA">
  <meta name="twitter:description" content="New to town, starting a new chapter, or craving real friendship — there's a seat here for you.">
  <meta name="twitter:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
  <meta name="twitter:image:alt" content="In Great Company">

  <!-- Fonts: Playfair Display + Montserrat (Google); Sisterhood self-hosted in base.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/signup.css">
  <!-- Who we are, in a form search engines can read. Organization rather than
       LocalBusiness: there is no storefront, no hours, no street address to
       claim. sameAs is the part that earns its keep — it ties this domain
       to the Instagram and Facebook profiles as a single entity. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "In Great Company",
    "url": "https://ingreatcompanysav.com/",
    "logo": "https://ingreatcompanysav.com/assets/img/logo-cream.png",
    "image": "https://ingreatcompanysav.com/assets/img/og-card.jpg",
    "description": "A women's social group in Savannah, Georgia. New to town, starting a new chapter, or craving real friendship — there's a seat here for you.",
    "email": "contact@ingreatcompanysav.com",
    "areaServed": {
      "@type": "City",
      "name": "Savannah",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Savannah",
        "addressRegion": "GA",
        "addressCountry": "US"
      }
    },
    "sameAs": [
      "https://www.instagram.com/ingreatcompanysav",
      "https://www.facebook.com/groups/ingreatcompanysav"
    ]
  }
  </script>
</head>
<body>
  <!-- app.js replaces #app wholesale on its first render, so everything below
       is a first paint, not live markup. It earns its place twice: a crawler
       that does not execute JS still sees a real <h1> and the intro copy, and
       a slow connection shows the headline instead of a blank page.

       KEEP IN SYNC with navBar() and homeView()'s hero in assets/js/app.js.
       Deliberately the hero only — the less mirrored here, the less can
       drift. The nav is included so the JS render does not shove the hero
       down a nav-height and cost us the layout shift. -->
  <div id="app">
    <nav class="nav" id="nav">
      <button class="nav__logo" data-nav="home" aria-label="In Great Company — home"><img src="/assets/img/logo-cream.png" alt="In Great Company"></button>
      <div class="nav__links">
        <button class="nav__link is-active" data-nav="home">Home</button>
        <button class="nav__link" data-nav="gatherings">Gatherings</button>
      </div>
    </nav>
    <main id="view">
      <section class="hero">
        <div class="hero__grid">
          <div>
            <div class="igc-eyebrow">A women's social group · Savannah, GA</div>
            <h1 class="hero__title">Every woman deserves a place to<br><span class="igc-script igc-script--xl">belong.</span></h1>
            <p class="hero__lead">New to Savannah, starting a new chapter, or just craving real friendship? There's a seat here for you. No pressure, no judgment, just women showing up for each other.</p>
            <div class="hero__actions">
              <button type="button" class="btn btn--default btn--lg" data-action="go-gatherings">See What's Coming Up</button>
            </div>
          </div>
          <div class="hero__media"><img src="/assets/img/photo-hero.jpg" alt="In Great Company members laughing together on a sailboat in Savannah"></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/assets/js/app.js?v=2"></script>
</body>
</html>
