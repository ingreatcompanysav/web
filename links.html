<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In Great Company — links</title>
  <meta name="description" content="Everything In Great Company, in one place: Instagram, the Facebook group, upcoming gatherings, and how to reach us.">
  <link rel="canonical" href="https://ingreatcompanysav.com/links">

  <link rel="icon" href="/assets/img/logo-cream.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/logo-cream.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="In Great Company">
  <!-- Title/description are what sit under the image on a shared card, so they
       read as the group's name rather than repeating the page's tab title. -->
  <meta property="og:title" content="In Great Company">
  <meta property="og:description" content="A women's social group in Savannah, Georgia — Instagram, the Facebook group, upcoming gatherings, and how to reach us.">
  <meta property="og:url" content="https://ingreatcompanysav.com/links">
  <!-- Preview card: the wordmark on the brand teal, not a photo. The raw
       logo PNG is a transparent cream wordmark, so it would render nearly
       invisible on iMessage's white card — og-card.jpg bakes it onto the teal
       at the 1200x630 the large-card scrapers expect. -->
  <meta property="og:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="In Great Company">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://ingreatcompanysav.com/assets/img/og-card.jpg">
  <meta name="twitter:image:alt" content="In Great Company">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    /* The links page is a single centred column — it shares the site's tokens
       but none of its layout, so its styles live here rather than in
       components.css (which the SPA loads and this page does not). */
    body{
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      background:var(--wash-sunrise);
      background-attachment:fixed;
    }
    .links-page{
      width:100%;
      max-width:560px;
      margin:0 auto;
      padding:clamp(40px,8vh,88px) var(--gutter) var(--space-8);
      flex:1 1 auto;
    }

    /* ---- header ---- */
    .links-head{text-align:center;animation:igcRise var(--dur-lazy) var(--ease-soft) both}
    /* The logo is the wordmark, so it stands in as the h1 — the alt text
       carries the heading for screen readers and search. */
    .links-head__title{margin:0 0 var(--space-4)}
    .links-head__logo{width:150px;height:auto;margin:0 auto}
    .links-head__tagline{
      font-size:var(--text-body-s);
      line-height:var(--leading-body-tight);
      color:var(--text-muted);
      max-width:34ch;
      margin:0 auto;
    }
    .links-head__place{
      display:inline-block;
      margin-top:var(--space-4);
      font-size:var(--text-eyebrow);
      font-weight:var(--weight-semibold);
      letter-spacing:var(--tracking-eyebrow);
      text-transform:uppercase;
      color:var(--brand-on-dark);
    }

    /* ---- the link stack ---- */
    .links-list{
      list-style:none;
      margin:var(--space-8) 0 0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:var(--gap-inline);
    }
    .link-item{
      /* staggered entrance, capped so a long list doesn't crawl in */
      animation:igcLift var(--dur-slow) var(--ease-soft) both;
      animation-delay:calc(min(var(--i),8) * 55ms + 120ms);
    }
    .link-btn{
      display:flex;
      align-items:center;
      gap:var(--space-4);
      padding:16px 18px;
      border-radius:var(--radius-md);
      border:var(--border-w) solid var(--border-hairline);
      background:var(--surface-card);
      box-shadow:var(--shadow-sm);
      text-decoration:none;
      color:var(--text-strong);
      transition:transform var(--dur-fast) var(--ease-soft),
                 box-shadow var(--dur-fast) var(--ease-soft),
                 border-color var(--dur-fast) var(--ease-soft);
    }
    .link-btn:hover{
      transform:var(--hover-lift);
      box-shadow:var(--shadow-lift);
      border-color:var(--tone-accent,var(--border-soft));
      color:var(--text-strong);
    }
    .link-btn:active{transform:var(--press-scale)}
    /* This block loads after base.css, so its box-shadow would otherwise beat
       the global :focus-visible ring and leave keyboard focus invisible. */
    .link-btn:focus-visible{
      box-shadow:var(--focus-ring);
      border-color:var(--tone-accent,var(--border-soft));
    }

    .link-btn__icon{
      flex:0 0 auto;
      width:42px;height:42px;
      display:grid;place-items:center;
      border-radius:var(--radius-circle);
      background:var(--tone-fill,rgba(255,250,240,.08));
      color:var(--tone-accent,var(--text-strong));
    }
    .link-btn__icon svg{width:20px;height:20px}

    .link-btn__text{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
    .link-btn__label{
      font-weight:var(--weight-semibold);
      font-size:var(--text-body-m);
      line-height:1.3;
    }
    .link-btn__sub{
      font-size:var(--text-body-s);
      line-height:1.4;
      color:var(--text-muted);
      /* Wrap rather than truncate — a cut-off email address is useless.
         `anywhere` keeps a long address from pushing the row wide. */
      overflow-wrap:anywhere;
    }
    .link-btn__chev{
      flex:0 0 auto;
      color:var(--tone-accent,var(--text-muted));
      opacity:.55;
      transition:transform var(--dur-fast) var(--ease-soft),opacity var(--dur-fast) var(--ease-soft);
    }
    .link-btn:hover .link-btn__chev{transform:translateX(3px);opacity:1}

    /* Tone accents — the same four the admin offers. */
    .link-btn--rose {--tone-accent:var(--brand-on-dark);--tone-fill:rgba(239,46,159,.16)}
    .link-btn--cyan {--tone-accent:var(--igc-cyan);--tone-fill:rgba(60,223,226,.14)}
    .link-btn--gold {--tone-accent:var(--gold-300);--tone-fill:rgba(239,214,26,.14)}
    .link-btn--cream{--tone-accent:var(--cream-100);--tone-fill:rgba(255,250,240,.12)}

    /* ---- footer ---- */
    .links-foot{
      text-align:center;
      padding:var(--space-6) var(--gutter) var(--space-8);
      font-size:var(--text-caption);
      color:var(--text-muted);
    }
    .links-foot a{color:var(--text-muted);text-decoration-color:var(--border-soft)}
    .links-foot a:hover{color:var(--text-strong)}
    .links-foot__dot{margin:0 var(--space-2);opacity:.5}

    @media (max-width:480px){
      .link-btn{padding:14px 15px;gap:var(--space-3)}
      .link-btn__icon{width:38px;height:38px}
    }
  </style>
</head>
<body>
  <main class="links-page">
    <header class="links-head">
      <h1 class="links-head__title"><img class="links-head__logo" src="/assets/img/logo-cream.png" alt="In Great Company"></h1>
      <p class="links-head__tagline">A women's social group. Come as you are — there's a seat here for you. 💛</p>
      <span class="links-head__place">Savannah, Georgia</span>
    </header>

    <ul class="links-list" id="links"></ul>
  </main>

  <footer class="links-foot">
    <a href="/">ingreatcompanysav.com</a>
    <span class="links-foot__dot">·</span>
    <a href="/#privacy">Privacy</a>
  </footer>

  <script type="module" src="/assets/js/links.js"></script>
</body>
</html>
