<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe — In Great Company</title>
  <meta name="description" content="Unsubscribe from the In Great Company newsletter.">
  <!-- Not a page for search results: it is only ever reached from a newsletter. -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" href="/assets/img/icon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/page.css">
  <style>
    /* Only the form — the card, title, lead, button and fine print are the
       shared shape in page.css. */
    .u-label{
      display:block;
      text-align:left;
      font-size:var(--text-body-s);
      font-weight:var(--weight-semibold);
      color:var(--text-strong);
      margin-bottom:var(--space-2);
    }
    .u-input{
      width:100%;
      font-size:var(--text-body-m);
      color:var(--text-strong);
      background:var(--surface-sunk);
      border:var(--border-w) solid var(--border-soft);
      border-radius:var(--radius-sm);
      padding:12px 13px;
      margin-bottom:var(--space-4);
    }
    .u-input::placeholder{color:var(--text-subtle)}
    .u-input:focus-visible{border-color:var(--border-focus);box-shadow:var(--focus-ring);outline:none}
    .u-ts{display:flex;justify-content:center;margin-bottom:var(--space-4);min-height:0}
    .u-err{
      font-size:var(--text-body-s);
      color:var(--brand-on-dark);
      background:rgba(239,46,159,.12);
      border-radius:var(--radius-sm);
      padding:10px 12px;
      margin:var(--space-4) 0 0;
    }
  </style>
</head>
<body>
  <main class="page-card">
    <img class="page-logo" src="/assets/img/logo-cream-340.png" width="340" height="178" alt="In Great Company">
    <div id="view">
      <p class="page-lead" aria-live="polite">Loading…</p>
    </div>
  </main>
  <script type="module" src="/assets/js/unsubscribe.js?v=2"></script>
</body>
</html>
