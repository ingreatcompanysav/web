# Cloudflare Pages + Functions config for the In Great Company site.
#
# Pages auto-deploys from GitHub, but this file is what makes the D1 binding
# work locally (`npx wrangler pages dev .`) and documents the binding for prod.
# In production the binding is ALSO set in the dashboard
# (Pages project -> Settings -> Functions -> D1 bindings), which is authoritative.

name = "web"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

# The whole site is static files at the repo root; Functions live in ./functions.
[[d1_databases]]
binding = "DB"
database_name = "igc"
# Fill this in after `npx wrangler d1 create igc` prints the database_id:
database_id = "24b04f1c-cb8b-4392-a605-dc32dfb11006"
